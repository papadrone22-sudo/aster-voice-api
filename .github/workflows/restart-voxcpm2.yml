name: Factory Restart VoxCPM2 Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub
      - name: Factory restart Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf spaces restart Papdrone22/aster-voxcpm --factory-reboot --token "$HF_TOKEN"
