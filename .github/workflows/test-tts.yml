name: Test Aster Pocket TTS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test reference-audio generation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q gradio_client soundfile requests
          python - <<'PY'
          import os
          import requests
          import soundfile as sf
          from gradio_client import Client, handle_file

          ref_url = "https://huggingface.co/kyutai/tts-voices/resolve/main/alba-mackenna/casual.wav"
          ref_path = "/tmp/reference.wav"
          r = requests.get(ref_url, timeout=60)
          r.raise_for_status()
          open(ref_path, "wb").write(r.content)

          client = Client(
              "https://papdrone22-aster-pocket-tts.hf.space",
              token=os.environ["HF_TOKEN"],
              verbose=False,
          )
          text = "Halo, aku Aster. Ini pengujian voice cloning menggunakan audio referensi agar hasil suara mengikuti karakter suara yang diberikan."
          result = client.predict(text, handle_file(ref_path), api_name="/generate")
          audio_path = result[0]
          audio, sr = sf.read(audio_path)
          duration = len(audio) / sr
          print("RESULT_STATUS=", result[1])
          print("DURATION_SECONDS=", duration)
          print("SAMPLE_RATE=", sr)
          print("SAMPLES=", len(audio))
          if duration < 2.0:
              raise RuntimeError(f"Reference-audio generation too short: {duration:.2f}s")
          PY
